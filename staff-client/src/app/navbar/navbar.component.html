<mat-toolbar>
    <div></div>
    <span class="page-title">Employee Directory</span>
    <span class="spacer"></span>
    <mat-slide-toggle 
        class="theme-toggle"
        [checked]="isDarkMode$ | async"
        (change)="toggleDarkMode()"
        color="primary">
        <mat-icon class="theme-icon"></mat-icon>
    </mat-slide-toggle>
    <button mat-stroked-button (click)="openHelp()">Help</button>
</mat-toolbar>
