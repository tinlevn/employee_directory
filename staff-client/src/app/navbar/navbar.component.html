<mat-toolbar>
  <span class="page-title">Employee Directory</span>
  <span class="spacer"></span>

  <div class="toolbar-actions">
    <div class="theme-toggle-wrapper" (click)="toggleDarkMode()" role="button" tabindex="0" (keydown.enter)="toggleDarkMode()" (keydown.space)="toggleDarkMode()">
      <mat-icon class="theme-icon">{{ (isDarkMode() ? 'dark_mode' : 'light_mode') }}</mat-icon>
      <span class="theme-label">{{ isDarkMode() ? 'Dark' : 'Light' }}</span>
    </div>

    <button mat-stroked-button color="primary" (click)="openHelp()">Help</button>
  </div>
</mat-toolbar>
